name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SMARTHUBLY_DEPLOY }}
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy parse-products-txt
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy parse-products-txt --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy ai-media-unified
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy ai-media-unified --project-ref qbcplbcdxoyqpmcehnvu --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy ai-chat-unified
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy ai-chat-unified --project-ref qbcplbcdxoyqpmcehnvu --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy invite-admin-request
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy invite-admin-request --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy notify-unified
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy notify-unified --project-ref qbcplbcdxoyqpmcehnvu --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy process-email-queue
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy process-email-queue --project-ref qbcplbcdxoyqpmcehnvu --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy send-marketing-campaign
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy send-marketing-campaign --project-ref qbcplbcdxoyqpmcehnvu --yes
        env:
