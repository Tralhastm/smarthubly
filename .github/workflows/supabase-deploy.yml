      - name: Deploy marketing-unified
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy marketing-unified --project-ref qbcplbcdxoyqpmcehnvu --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ env.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy automations-cron
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
