name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase functions deploy ai-chat-unified --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt
          supabase functions deploy sofia-agent --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt
          supabase functions deploy clara-agent --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt
          supabase functions deploy cindy-agent --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt
          supabase functions deploy store-agent --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt
          supabase functions deploy cindy-actions --project-ref qbcplbcdxoyqpmcehnvu --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
